<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NutriSense AI — Your intelligent food and health companion. Context-aware meal recommendations, food health scanner, habit tracking, and nearby healthy restaurants." />
  <meta name="keywords" content="nutrition, health, food, AI, meal planner, diet, healthy eating" />
  <meta name="author" content="NutriSense AI Team" />
  <meta name="theme-color" content="#06060e" />

  <title>NutriSense AI — Intelligent Food & Health Assistant</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Google Maps API (Replace with your key) -->
  <!-- <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places" defer></script> -->

  <!-- Firebase SDK (Optional — uncomment to enable cloud sync) -->
  <!-- <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script> -->
  <!-- <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script> -->
  <!-- <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script> -->
</head>
<body>
  <!-- Application Root -->
  <div id="app" role="application" aria-label="NutriSense AI Application">
    <!-- Loading Screen -->
    <div style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #06060e 0%, #0c0c1a 50%, #10102a 100%);
      color: #f0f0f8;
      font-family: 'Inter', sans-serif;
      gap: 1rem;
    ">
      <div style="font-size: 3.5rem; animation: pulse 2s ease-in-out infinite;">🧠</div>
      <div style="
        font-size: 1.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #818cf8, #6366f1, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      ">NutriSense AI</div>
      <div style="color: #6a6a8a; font-size: 0.85rem;">Loading your intelligent food companion...</div>
      <style>@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }</style>
    </div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
